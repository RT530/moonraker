# Don't open a PR straight from this fork's default branch to upstream - the sync
# commits would show up in the diff. Branch from upstream/master instead: see
# 'git fetch upstream master && git checkout -b my-fix upstream/master'.

name: Sync with upstream (Arksine/moonraker)

on:
  schedule:
    - cron: '0 0 * * *' # daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    # guards against this ever running as upstream's own workflow (e.g. if this file
    # were merged into Arksine/moonraker by any path) - it would otherwise try to
    # add itself as its own "upstream" remote and push to its own default branch
    if: github.repository != 'Arksine/moonraker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          # SYNC_TOKEN is a PAT carrying the `workflow` scope. Without it the
          # default GITHUB_TOKEN is used, which GitHub refuses to let push any
          # upstream commit that touches .github/workflows/**.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Arksine/moonraker.git
          git fetch upstream master

      - name: Merge upstream/master into master
        run: |
          git merge upstream/master --no-edit

      - name: Push
        run: |
          if ! git push origin master; then
            echo "::error::Push failed. If the error mentions the workflows"
            echo "::error::permission, upstream changed a file under"
            echo "::error::.github/workflows/ and the default GITHUB_TOKEN cannot"
            echo "::error::push it. Add a PAT with the workflow scope as the"
            echo "::error::SYNC_TOKEN secret in this repository."
            exit 1
          fi
